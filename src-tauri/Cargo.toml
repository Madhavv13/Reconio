[package]
name = "reconio"
version = "0.1.0"
description = "Reconio: desktop recon for authorized security testing"
authors = ["Reconio"]
edition = "2024"
repository = "https://github.com/Madhavv13/Reconio"
license-file = "../LICENSE"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reconio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ts-rs = "11"
rusqlite = { version = "0.37", features = ["bundled"] }
idna = "1"
ipnet = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
whoami = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The tool check hashes ~110 MB of binaries; keep it fast in debug builds too.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
proptest = "1"
tempfile = "3"
